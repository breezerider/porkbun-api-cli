[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "porkbun_api_cli"
authors = [
    {name = "Oleksandr Ostrenko", email = "oleksandr@ostrenko.dev"},
]
description = "CLI client for managing domain DNS records through Porkbun API calls"
readme = "README.rst"
requires-python = ">=3.11"
keywords = ["porkbun", "dns", "administration"]
license = "BSD-3-Clause"
classifiers = [
    # As from http://pypi.python.org/pypi?%3Aaction=list_classifiers
    # "Development Status :: 1 - Planning",
    # "Development Status :: 2 - Pre-Alpha",
    "Development Status :: 3 - Alpha",
    # "Development Status :: 4 - Beta",
    # "Development Status :: 5 - Production/Stable",
    # "Development Status :: 6 - Mature",
    # "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Operating System :: MacOS",
    "Operating System :: Unix",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click",
    "pyyaml",
    "requests",
]
dynamic = ["version"]

# see https://daniel.feldroy.com/posts/2023-08-pypi-project-urls-cheatsheet
[project.urls]

# Project homepage
homepage = "https://github.com/breezerider/porkbun-api-cli"

# The changelog
changelog = "https://github.com/breezerider/porkbun-api-cli/blob/master/CHANGELOG.rst"

# Any long form docs
documentation = "https://porkbun-api-cli.readthedocs.io/"

# Bugs/issues/feature requests
issues = "https://github.com/breezerider/porkbun-api-cli/issues"


[tool.setuptools.dynamic]
version = {attr = "porkbun_api_cli.__version__"}

[project.scripts]
porkbun-api-cli = "porkbun_api_cli.cli:main"

[dependency-groups]
dev = [
    'pytest',
    'pytest-cov',
    'ruff',
    'ty',
    'types-PyYAML',
    'types-requests',
    'docutils',
    'check-manifest',
    'readme-renderer',
    'pygments',
    'coverage',
    'sphinx>=1.3',
    'sphinx-rtd-theme',
    'sphinx-click',
    'tox',
]

[tool.bumpversion]
allow_dirty = false
commit = true
message = "Bump version: {current_version} → {new_version}"
commit_args = ""
tag = true
sign_tags = true
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
current_version = "0.2.0"
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = [
    "{major}.{minor}.{patch}"
]
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "src/porkbun_api_cli/__init__.py"
search = "__version__ = \"{current_version}\""
replace = "__version__ = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "CHANGELOG.rst"
search = "Unreleased"
replace = "{new_version} ({now:%Y-%m-%d})"

[[tool.bumpversion.files]]
filename = "README.rst"
search = "v{current_version}"
replace = "v{new_version}"

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests", "*__init__.py", "*__init__.pxd"]
parallel = true

[tool.coverage.report]
fail_under = 95
show_missing = true
precision = 2
omit = ["*migrations*"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["docs/ristretto", ".agents"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E203", "E501", "E701"]

[tool.ruff.format]
quote-style = "preserve"
preview = true

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.pytest.ini_options]
norecursedirs = ["migrations", ".tox", ".git"]
python_files = ["test_*.py", "*_test.py", "tests.py"]
addopts = [
    "-ra",
    "--strict-markers",
    "--doctest-modules",
    "--doctest-glob=*.rst",
    "--tb=short",
    "--import-mode=importlib",
]
testpaths = ["tests"]
filterwarnings = ["error"]

[tool.ty.environment]
python-version = "3.11"
